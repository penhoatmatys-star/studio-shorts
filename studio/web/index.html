<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Shorts</title>
<meta name="description" content="Veille, scripts et production de Shorts : l'atelier de Matys et Elian.">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--
THESIS: un poste de montage, pas une page web. La chaîne veille → script → production vit dans
  l'ossature d'un logiciel de montage (bibliothèque, moniteur, inspecteur, pages en bas) ; refuse
  la pile de cartes centrée façon site.
OWN-WORLD: graphite froid en panneaux jointifs séparés par 2 px de fond, une seule couleur
  d'action orange « tête de lecture », verdicts vert/jaune/rouge réservés aux notes. Schibsted
  Grotesk pour les titres, Hanken Grotesk pour l'interface, JetBrains Mono pour les chiffres,
  timecodes et journal.
STORY: on choisit un sujet dans la bibliothèque, on le juge au moniteur, on valide dans
  l'inspecteur, on écrit avec l'IA, on lance la production et on la suit comme une file de rendu.
FIRST VIEWPORT: barre de titre fine (veille, recherche Ctrl K, actions), trois panneaux, barre de
  pages en bas avec Veille / Script / Production ; action principale dans l'inspecteur.
FORM: brief épinglé par Matys (DaVinci Resolve / Premiere), pas de tirage.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the
  verdict, DESIGN.md, and every shipping raster carrying its provenance
-->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></symbol>
    <symbol id="i-veille" viewBox="0 0 24 24"><path d="M4 5h13v14H6a2 2 0 0 1-2-2Z"/><path d="M17 9h3v8a2 2 0 0 1-2 2"/><path d="M8 9h5M8 13h5"/></symbol>
    <symbol id="i-script" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 13h8M8 17h5"/></symbol>
    <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></symbol>
    <symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 20h20Z"/><path d="M12 10v4M12 17.5v.01"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-bash" viewBox="0 0 24 24"><path d="m5 7 5 5-5 5M12 17h7"/></symbol>
    <symbol id="i-read" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></symbol>
    <symbol id="i-web" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></symbol>
    <symbol id="i-queue" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
    <symbol id="i-quote" viewBox="0 0 24 24"><path d="M5 8h5v5H5c0 3 1 4 3 5M14 8h5v5h-5c0 3 1 4 3 5"/></symbol>
  </defs>
</svg>

<div class="shell">
  <header class="titlebar">
    <div class="brand"><img src="logo.svg" alt="" width="20" height="20"> Studio Shorts</div>
    <label class="veille-pick" title="Rapport de veille affiché">
      <svg class="ic"><use href="#i-veille"/></svg>
      <select id="choixVeille" aria-label="Rapport de veille"></select>
    </label>
    <form class="omni" id="formRecherche" role="search">
      <svg class="ic"><use href="#i-search"/></svg>
      <input id="champRecherche" autocomplete="off" aria-label="Documenter un sujet"
        placeholder="Documenter un sujet : « la clause de Yamal », « Wemby contre Jokic »…">
      <kbd id="raccourci">Ctrl K</kbd>
    </form>
    <div class="tb-actions">
      <button class="btn" id="btnScript"><svg class="ic"><use href="#i-pen"/></svg> Mon script</button>
      <button class="btn" id="btnVeille"><svg class="ic"><use href="#i-refresh"/></svg> <span>Nouvelle veille</span></button>
      <span class="etat-ia" id="ia" role="status"><i></i><span>IA…</span></span>
    </div>
  </header>

  <div id="bandeau" class="bandeau" hidden role="alert"></div>

  <div class="workspace">
    <aside class="pane library" aria-label="Bibliothèque">
      <div class="pane-head tabs" role="tablist">
        <button role="tab" data-bibli="sujets" id="tabSujets">Sujets <span class="n" id="nSujets"></span></button>
        <button role="tab" data-bibli="montages" id="tabMontages">Montages <span class="n" id="nMontages"></span></button>
      </div>
      <div class="pane-body" id="bibli"></div>
    </aside>
    <main class="pane viewer" id="viewer" tabindex="-1"></main>
    <aside class="pane inspector" id="inspecteur" aria-label="Inspecteur"></aside>
  </div>

  <footer class="pagebar">
    <div class="pb-left" id="pbGauche"></div>
    <nav class="pages" id="pages" aria-label="Étapes">
      <button data-vue="veille" title="Veille (Ctrl 1)"><svg class="ic"><use href="#i-veille"/></svg>Veille</button>
      <button data-vue="scripts" title="Script (Ctrl 2)"><svg class="ic"><use href="#i-script"/></svg>Script</button>
      <button data-vue="production" title="Production (Ctrl 3)"><svg class="ic"><use href="#i-film"/></svg>Production</button>
    </nav>
    <div class="pb-right" id="pbDroite"></div>
  </footer>
</div>

<dialog id="modale" class="modale"><div id="modaleBoite"></div></dialog>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
